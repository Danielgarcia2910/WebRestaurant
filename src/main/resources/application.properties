spring.application.name=app
server.port=8081

spring.datasource.url=jdbc:mysql://localhost:3306/restaurante_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
# Escribe aquí la contraseña de tu MySQL (la misma que usas en Workbench)
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=1MB
restaurante.fotos=fotos

restaurante.admin.usuario=admin
restaurante.admin.clave=admin123

spring.devtools.restart.enabled=true
spring.thymeleaf.cache=false
